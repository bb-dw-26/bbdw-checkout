name: Patchwork
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número da issue do incidente
        required: true
        type: string
      scenario:
        description: Cenário autorizado
        type: choice
        options: [CHK-003, CHK-004]
        default: CHK-003
permissions:
  contents: read
jobs:
  patchwork:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.actor == 'sentry[bot]' && github.event.issue.user.id == 39604003 &&
        contains(github.event.issue.labels.*.name, 'agent:repair') &&
        contains(github.event.issue.labels.*.name, 'sentry')) ||
       (vars.PATCHWORK_BOT_ID != '' && format('{0}', github.event.issue.user.id) == vars.PATCHWORK_BOT_ID &&
        contains(github.event.issue.labels.*.name, 'agent:repair') &&
        contains(github.event.issue.labels.*.name, 'agent:handoff')))
    permissions:
      contents: read
      issues: read
      pull-requests: read
      copilot-requests: write
    # Patchwork v3: motor e workflow fixados na mesma revisão.
    uses: bb-dw-26/patchwork/.github/workflows/patchwork.yml@420eb3bd7334830acc8f483de256d5b002e384e4
    with:
      issue_number: ${{ format('{0}', github.event.issue.number || inputs.issue_number) }}
      config_path: ${{ (inputs.scenario == 'CHK-004' || contains(github.event.issue.labels.*.name, 'scenario:CHK-004')) && '.github/patchwork-chk004.json' || '.github/patchwork.json' }}
      node_version: '24'
      install_command: npm ci
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PATCHWORK_PUBLISH_APP_PRIVATE_KEY: ${{ secrets.PATCHWORK_PUBLISH_APP_PRIVATE_KEY }}
      PATCHWORK_APP_PRIVATE_KEY: ${{ secrets.PATCHWORK_APP_PRIVATE_KEY }}
